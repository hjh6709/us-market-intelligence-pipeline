<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">U.S. Economic Event Market Data Pipeline</title>
  <desc id="desc">CPI 원시 체결 실측 경로와 다중 경제 이벤트의 181분 및 전후 7거래일 분석 계획을 구분한 데이터 파이프라인 아키텍처</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <marker id="purpleArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker>
    <style>
      .title{font:700 34px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;fill:#0f172a}.subtitle{font:400 17px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;fill:#475569}.section{font:700 20px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;fill:#0f172a}.small{font:400 13px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;fill:#475569}.boxt{font:700 17px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;fill:#0f172a}.copy{font:400 13px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;fill:#334155}.metric{font:700 15px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;fill:#0369a1}.lane{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}.source{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.raw{fill:#f0f9ff;stroke:#0284c7;stroke-width:2}.process{fill:#eef2ff;stroke:#4f46e5;stroke-width:2}.store{fill:#ecfdf5;stroke:#059669;stroke-width:2}.evidence{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.planned{fill:#faf5ff;stroke:#7c3aed;stroke-width:2;stroke-dasharray:8 6}.flow{fill:none;stroke:#334155;stroke-width:2.3;marker-end:url(#arrow)}.plannedflow{fill:none;stroke:#7c3aed;stroke-width:2.3;stroke-dasharray:8 6;marker-end:url(#purpleArrow)}
    </style>
  </defs>
  <rect width="1600" height="1080" fill="#fff"/>
  <text x="52" y="58" class="title">U.S. Economic Event Market Data Pipeline</text>
  <text x="52" y="88" class="subtitle">원시 체결 121분 검증은 보존하고, 발표 당일 181분과 전후 7거래일 분석을 별도 계층으로 확장</text>
  <g transform="translate(52 112)"><rect width="20" height="20" rx="4" class="source"/><text x="30" y="15" class="small">현재 구현 · 실행 결과 확인</text><rect x="210" width="20" height="20" rx="4" class="planned"/><text x="240" y="15" class="small">후속 확장 · 입력 계획 검증 · 데이터 수집 예정</text></g>

  <rect x="36" y="158" width="1528" height="225" rx="18" class="lane"/>
  <text x="58" y="190" class="section">1. 분석 기준과 원본 데이터</text>
  <text x="58" y="214" class="small">BLS · ALFRED · Alpaca SIP 기존 경로 + BEA · Federal Reserve 공식 일정. 실측 수치는 CPI 55회 × 4종목 결과</text>

  <rect x="55" y="240" width="280" height="112" rx="14" class="source"/>
  <text x="195" y="270" text-anchor="middle" class="boxt">공식 발표 catalog</text><text x="195" y="298" text-anchor="middle" class="copy">CPI 55 · 고용 8 · PCE 9 · FOMC 5</text><text x="195" y="326" text-anchor="middle" class="metric">77회 발표 시각 검증</text>
  <rect x="385" y="240" width="300" height="112" rx="14" class="source"/>
  <text x="535" y="270" text-anchor="middle" class="boxt">FRED · ALFRED</text><text x="535" y="298" text-anchor="middle" class="copy">물가·고용·금리·VIX point-in-time</text><text x="535" y="326" text-anchor="middle" class="metric">10개 지표 × 55회 = 550 context</text>
  <rect x="735" y="240" width="300" height="112" rx="14" class="source"/>
  <text x="885" y="270" text-anchor="middle" class="boxt">Alpaca Historical SIP</text><text x="885" y="298" text-anchor="middle" class="copy">4종목 · 발표 전후 121분 실제 체결</text><text x="885" y="326" text-anchor="middle" class="metric">7,360,804 raw trades</text>
  <rect x="1085" y="240" width="430" height="112" rx="14" class="raw"/>
  <text x="1300" y="270" text-anchor="middle" class="boxt">로컬 원본 보관</text><text x="1300" y="298" text-anchor="middle" class="copy">55 CPI × 4 symbols = 220 Parquet partitions</text><text x="1300" y="326" text-anchor="middle" class="metric">외부 API 재호출 없이 부하 재생</text>
  <path d="M335 296 H385" class="flow"/><path d="M685 296 H735" class="flow"/><path d="M1035 296 H1085" class="flow"/>

  <rect x="36" y="408" width="1528" height="250" rx="18" class="lane"/>
  <text x="58" y="440" class="section">2. 대량 처리와 저장</text>
  <text x="58" y="464" class="small">기준 118,118건과 부하 7,360,804건에 같은 처리 규칙 적용</text>
  <rect x="55" y="492" width="260" height="126" rx="14" class="raw"/>
  <text x="185" y="522" text-anchor="middle" class="boxt">실행 제어</text><text x="185" y="550" text-anchor="middle" class="copy">Airflow orchestration · GCP runner</text><text x="185" y="578" text-anchor="middle" class="metric">입력 범위·실행 ID 기록</text>
  <rect x="355" y="492" width="260" height="126" rx="14" class="process"/>
  <text x="485" y="522" text-anchor="middle" class="boxt">Kafka</text><text x="485" y="550" text-anchor="middle" class="copy">raw.market-sip.v1 · 3 partitions</text><text x="485" y="578" text-anchor="middle" class="metric">발행 = 수신 = 7,360,804</text>
  <rect x="655" y="492" width="300" height="126" rx="14" class="process"/>
  <text x="805" y="522" text-anchor="middle" class="boxt">Spark Batch / Streaming</text><text x="805" y="550" text-anchor="middle" class="copy">schema·UTC·event_id·SIP 조건 검사</text><text x="805" y="578" text-anchor="middle" class="metric">중복 49 제거 · 오류 0</text>
  <rect x="995" y="492" width="270" height="126" rx="14" class="store"/>
  <text x="1130" y="522" text-anchor="middle" class="boxt">PostgreSQL</text><text x="1130" y="548" text-anchor="middle" class="copy">market_bars · economic_events</text><text x="1130" y="568" text-anchor="middle" class="copy">macro_event_impacts · key Upsert</text><text x="1130" y="592" text-anchor="middle" class="metric">1분봉 22,260행 · 중복 0</text>
  <rect x="1305" y="492" width="240" height="126" rx="14" class="evidence"/>
  <text x="1425" y="522" text-anchor="middle" class="boxt">검증 증거</text><text x="1425" y="550" text-anchor="middle" class="copy">건수·고유키·결과 hash</text><text x="1425" y="578" text-anchor="middle" class="metric">DB 장애 후 동일 결과</text>
  <path d="M315 555 H355" class="flow"/><path d="M615 555 H655" class="flow"/><path d="M955 555 H995" class="flow"/><path d="M1265 555 H1305" class="flow"/>

  <rect x="36" y="683" width="1528" height="257" rx="18" class="lane"/>
  <text x="58" y="715" class="section">3. 분석 시간축과 결측 처리</text>
  <text x="58" y="739" class="small">목적에 따라 raw 121분 · 분석용 181분 · 전후 15거래 세션을 분리하고, 없는 가격이나 미래 거래일을 채우지 않음</text>
  <rect x="55" y="768" width="300" height="130" rx="14" class="source"/>
  <text x="205" y="798" text-anchor="middle" class="boxt">CORE_RAW_121M</text><text x="205" y="826" text-anchor="middle" class="copy">T-60~T+60 · SIP 개별 체결</text><text x="205" y="854" text-anchor="middle" class="metric">Kafka·Spark 정합성 검증 완료</text>
  <rect x="405" y="768" width="330" height="130" rx="14" class="planned"/>
  <text x="570" y="798" text-anchor="middle" class="boxt">SESSION_1MIN</text><text x="570" y="826" text-anchor="middle" class="copy">T-60~T+120 · 최대 181개 1분봉</text><text x="570" y="854" text-anchor="middle" class="copy">5·30·60분 + 장 시작·마감 반응</text>
  <rect x="785" y="768" width="330" height="130" rx="14" class="evidence"/>
  <text x="950" y="798" text-anchor="middle" class="boxt">3분봉 · 5분봉 파생</text><text x="950" y="826" text-anchor="middle" class="copy">원본 분 수 · COMPLETE/PARTIAL</text><text x="950" y="854" text-anchor="middle" class="copy">1분봉 유지 · 없는 가격은 안 채움</text>
  <rect x="1165" y="768" width="380" height="130" rx="14" class="planned"/>
  <text x="1355" y="798" text-anchor="middle" class="boxt">DAILY_15_SESSIONS</text><text x="1355" y="826" text-anchor="middle" class="copy">이전 7 + 발표일 + 이후 7거래일</text><text x="1355" y="854" text-anchor="middle" class="metric">1·3·7일 흐름 · 주말 제외</text>
  <path d="M355 833 H405" class="plannedflow"/><path d="M735 833 H785" class="flow"/><path d="M355 875 C650 925 1020 925 1165 875" class="plannedflow"/>

  <rect x="52" y="968" width="1496" height="76" rx="16" class="planned"/>
  <text x="80" y="998" class="section">검증된 다음 실행</text>
  <text x="280" y="998" class="copy">77회 발표 × 10종목 context 수집</text><text x="790" y="998" class="copy">→ 1m·1d Upsert</text><text x="1080" y="998" class="copy">→ coverage · event study · backtest</text>
  <text x="80" y="1026" class="small">전체 수치는 계획값. FOMC×TLT smoke: 1m 181행 · 3m 61행 · 5m 37행 · 1d 15행 DB 확인. 나머지는 완료로 표시하지 않습니다.</text>
</svg>
