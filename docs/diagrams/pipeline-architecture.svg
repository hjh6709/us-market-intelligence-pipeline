<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1290" viewBox="0 0 1600 1290" role="img" aria-labelledby="title desc">
  <title id="title">U.S. Economic Event Market Reaction Pipeline</title>
  <desc id="desc">현재 실행한 원시 체결, 시장 데이터, 경제 맥락, 이벤트 분석과 서빙 경로를 향후 주문 계층과 구분한 구성도</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker>
    <marker id="future-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#7c3aed"/></marker>
    <style>
      .title{font:700 34px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;fill:#0f172a}
      .subtitle{font:400 17px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;fill:#475569}
      .section{font:700 21px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;fill:#0f172a}
      .box-title{font:700 17px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;fill:#0f172a}
      .copy{font:400 13px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;fill:#334155}
      .metric{font:700 14px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;fill:#0369a1}
      .lane{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}
      .source{fill:#eff6ff;stroke:#2563eb;stroke-width:2}
      .process{fill:#eef2ff;stroke:#4f46e5;stroke-width:2}
      .store{fill:#ecfdf5;stroke:#059669;stroke-width:2}
      .evidence{fill:#fff7ed;stroke:#ea580c;stroke-width:2}
      .future{fill:#faf5ff;stroke:#7c3aed;stroke-width:2;stroke-dasharray:8 6}
      .flow{fill:none;stroke:#334155;stroke-width:2.3;marker-end:url(#arrow)}
      .future-flow{fill:none;stroke:#7c3aed;stroke-width:2.3;stroke-dasharray:8 6;marker-end:url(#future-arrow)}
    </style>
  </defs>
  <rect width="1600" height="1290" fill="#fff"/>
  <text x="52" y="58" class="title">U.S. Economic Event Market Reaction Pipeline</text>
  <text x="52" y="88" class="subtitle">실제 실행한 수집·처리·분석은 실선, 아직 구현하지 않은 실거래 단계는 점선으로 표시</text>

  <rect x="36" y="120" width="1528" height="235" rx="18" class="lane"/>
  <text x="58" y="155" class="section">A · 원시 체결 정확성·부하 검증</text>
  <text x="58" y="180" class="copy">CPI 55회 × 4종목 원본 / Kafka v2는 기준 118,118건으로 실제 재검증</text>
  <rect x="58" y="205" width="240" height="110" rx="14" class="source"/>
  <text x="178" y="238" text-anchor="middle" class="box-title">Alpaca SIP trades</text><text x="178" y="266" text-anchor="middle" class="copy">실제 개별 체결</text><text x="178" y="292" text-anchor="middle" class="metric">부하 원본 7,360,804</text>
  <rect x="338" y="205" width="220" height="110" rx="14" class="source"/>
  <text x="448" y="238" text-anchor="middle" class="box-title">Parquet</text><text x="448" y="266" text-anchor="middle" class="copy">row count · checksum</text><text x="448" y="292" text-anchor="middle" class="metric">220 partitions</text>
  <rect x="598" y="205" width="250" height="110" rx="14" class="process"/>
  <text x="723" y="238" text-anchor="middle" class="box-title">Kafka v2 · 6 partitions</text><text x="723" y="266" text-anchor="middle" class="copy">event + symbol + 15분 segment</text><text x="723" y="292" text-anchor="middle" class="metric">최대 비중 33.9%</text>
  <rect x="888" y="205" width="260" height="110" rx="14" class="process"/>
  <text x="1018" y="238" text-anchor="middle" class="box-title">Spark</text><text x="1018" y="266" text-anchor="middle" class="copy">검증 · 중복 · 거래조건 · 1분 집계</text><text x="1018" y="292" text-anchor="middle" class="metric">입력 118,118 · 오류 0</text>
  <rect x="1188" y="205" width="335" height="110" rx="14" class="store"/>
  <text x="1356" y="238" text-anchor="middle" class="box-title">PostgreSQL market_bars</text><text x="1356" y="266" text-anchor="middle" class="copy">business key Upsert</text><text x="1356" y="292" text-anchor="middle" class="metric">1분봉 472 · 중복 0</text>
  <path d="M298 260H338" class="flow"/><path d="M558 260H598" class="flow"/><path d="M848 260H888" class="flow"/><path d="M1148 260H1188" class="flow"/>

  <rect x="36" y="385" width="1528" height="265" rx="18" class="lane"/>
  <text x="58" y="420" class="section">B · 공식 발표와 10종목 시장 데이터</text>
  <text x="58" y="445" class="copy">2022-01-07~2026-08-26 · 202회 × 10종목 = 2,020개 분석 구간</text>
  <rect x="58" y="475" width="285" height="120" rx="14" class="source"/>
  <text x="201" y="508" text-anchor="middle" class="box-title">Official event catalog</text><text x="201" y="536" text-anchor="middle" class="copy">BLS · BEA · Federal Reserve</text><text x="201" y="564" text-anchor="middle" class="metric">CPI 55 · 고용 55 · PCE 55 · FOMC 37</text>
  <rect x="383" y="475" width="285" height="120" rx="14" class="process"/>
  <text x="526" y="508" text-anchor="middle" class="box-title">Airflow / Python</text><text x="526" y="536" text-anchor="middle" class="copy">발표별 task · 10종목 batch 요청</text><text x="526" y="564" text-anchor="middle" class="metric">4,040 → 404 requests</text>
  <rect x="708" y="475" width="285" height="120" rx="14" class="source"/>
  <text x="851" y="508" text-anchor="middle" class="box-title">Alpaca SIP bars</text><text x="851" y="536" text-anchor="middle" class="copy">T-60~T+120분 · ±7거래일</text><text x="851" y="564" text-anchor="middle" class="metric">1m 308,512 · 1d 30,250</text>
  <rect x="1033" y="475" width="240" height="120" rx="14" class="process"/>
  <text x="1153" y="508" text-anchor="middle" class="box-title">3m · 5m 생성</text><text x="1153" y="536" text-anchor="middle" class="copy">COMPLETE / PARTIAL</text><text x="1153" y="564" text-anchor="middle" class="metric">112,593 · 70,090</text>
  <rect x="1313" y="475" width="210" height="120" rx="14" class="store"/>
  <text x="1418" y="508" text-anchor="middle" class="box-title">PostgreSQL</text><text x="1418" y="536" text-anchor="middle" class="copy">bars · work · checks</text><text x="1418" y="564" text-anchor="middle" class="metric">Upsert · coverage</text>
  <path d="M343 535H383" class="flow"/><path d="M668 535H708" class="flow"/><path d="M993 535H1033" class="flow"/><path d="M1273 535H1313" class="flow"/>
  <rect x="383" y="610" width="890" height="25" rx="8" class="evidence"/>
  <text x="828" y="628" text-anchor="middle" class="copy">Airflow 전체 실행: 202 mapped tasks · 2,020 work items · 결과 검증</text>

  <rect x="36" y="680" width="1528" height="180" rx="18" class="lane"/>
  <text x="58" y="715" class="section">C · 발표 당시 경제 상황</text>
  <rect x="115" y="745" width="330" height="80" rx="14" class="source"/>
  <text x="280" y="776" text-anchor="middle" class="box-title">같은 공식 발표 202회</text><text x="280" y="803" text-anchor="middle" class="copy">released_at 기준</text>
  <rect x="635" y="745" width="330" height="80" rx="14" class="process"/>
  <text x="800" y="776" text-anchor="middle" class="box-title">FRED · ALFRED</text><text x="800" y="803" text-anchor="middle" class="copy">10 series · 당시 이용 가능 값</text>
  <rect x="1155" y="745" width="330" height="80" rx="14" class="store"/>
  <text x="1320" y="776" text-anchor="middle" class="box-title">macro_event_contexts</text><text x="1320" y="803" text-anchor="middle" class="metric">202 × 10 = 2,020행</text>
  <path d="M445 785H635" class="flow"/><path d="M965 785H1155" class="flow"/>

  <rect x="36" y="890" width="1528" height="145" rx="18" class="lane"/>
  <text x="58" y="925" class="section">D · 이벤트 반응 분석과 전략 검증</text>
  <rect x="90" y="952" width="390" height="58" rx="12" class="store"/>
  <text x="285" y="977" text-anchor="middle" class="box-title">Event-window metrics</text><text x="285" y="998" text-anchor="middle" class="metric">202 × 10 × 4 = 8,080행</text>
  <rect x="605" y="952" width="390" height="58" rx="12" class="evidence"/>
  <text x="800" y="977" text-anchor="middle" class="box-title">탐색용 비용 포함 backtest</text><text x="800" y="998" text-anchor="middle" class="copy">평균 -0.1565% · 수익 주장 아님</text>
  <rect x="1120" y="952" width="390" height="58" rx="12" class="store"/>
  <text x="1315" y="977" text-anchor="middle" class="box-title">event_strategy_results</text><text x="1315" y="998" text-anchor="middle" class="copy">2,020행 · Upsert · 연구 신호</text>
  <path d="M480 981H605" class="flow"/><path d="M995 981H1120" class="flow"/>

  <rect x="36" y="1065" width="1528" height="180" rx="18" class="lane"/>
  <text x="58" y="1100" class="section">E · 저장 결과 서빙과 향후 주문 계층</text>
  <rect x="70" y="1125" width="270" height="85" rx="14" class="store"/>
  <text x="205" y="1157" text-anchor="middle" class="box-title">PostgreSQL final tables</text><text x="205" y="1185" text-anchor="middle" class="copy">event · bars · context · impact · strategy</text>
  <rect x="385" y="1125" width="300" height="85" rx="14" class="process"/>
  <text x="535" y="1157" text-anchor="middle" class="box-title">Serving API · Dashboard</text><text x="535" y="1185" text-anchor="middle" class="metric">RESEARCH_ONLY · NO_TRADE</text>
  <path d="M340 1168H385" class="flow"/>
  <rect x="750" y="1125" width="765" height="85" rx="14" class="future"/>
  <text x="1133" y="1153" text-anchor="middle" class="box-title">향후 주문 계층</text>
  <text x="1133" y="1177" text-anchor="middle" class="copy">Surprise · 통제군 → Paper trading → Risk engine → Slack 승인</text>
  <text x="1133" y="1198" text-anchor="middle" class="copy">Broker adapter → 주문·체결·포지션 복구 → Limited live → Automated live</text>
  <path d="M685 1168H750" class="future-flow"/>
</svg>
