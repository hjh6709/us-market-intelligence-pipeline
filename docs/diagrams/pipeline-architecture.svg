<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950" role="img" aria-labelledby="title desc">
  <title id="title">U.S. Macro Impact and Market Data Pipeline architecture</title>
  <desc id="desc">Actual Alpaca trades flow through ingestion, Kafka raw storage, Spark processing and PostgreSQL. Official macro data, Airflow, analysis and BI are planned next.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; fill: #475569; }
      .lane { font: 700 18px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; fill: #334155; letter-spacing: .4px; }
      .box-title { font: 700 19px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; fill: #0f172a; }
      .box-copy { font: 400 15px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; fill: #334155; }
      .edge-copy { font: 600 13px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; fill: #475569; }
      .note { font: 400 14px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; fill: #475569; }
      .implemented { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.5; }
      .stored { fill: #ecfdf5; stroke: #059669; stroke-width: 2.5; }
      .planned { fill: #faf5ff; stroke: #9333ea; stroke-width: 2.5; stroke-dasharray: 10 7; }
      .neutral { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
      .flow { fill: none; stroke: #334155; stroke-width: 2.5; marker-end: url(#arrow); }
      .planned-flow { fill: none; stroke: #7e22ce; stroke-width: 2.5; stroke-dasharray: 9 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="950" fill="#ffffff"/>
  <text x="54" y="58" class="title">U.S. Macro Impact &amp; Market Data Pipeline</text>
  <text x="54" y="88" class="subtitle">데이터가 수집 → 원본 보관 → 처리 → 저장 → 분석으로 흐르는 전체 구조</text>

  <g transform="translate(54 113)">
    <rect x="0" y="0" width="22" height="22" rx="4" class="implemented"/>
    <text x="32" y="17" class="note">현재 구현 경로</text>
    <rect x="190" y="0" width="22" height="22" rx="4" class="planned"/>
    <text x="222" y="17" class="note">다음 단계</text>
    <text x="420" y="17" class="note">실선: 구현 경로 · 화살표 설명: 실제 실행 증거 범위 · 점선: 예정 경로</text>
  </g>

  <g>
    <rect x="38" y="160" width="270" height="660" rx="16" class="neutral"/>
    <rect x="342" y="160" width="270" height="660" rx="16" class="neutral"/>
    <rect x="646" y="160" width="270" height="660" rx="16" class="neutral"/>
    <rect x="950" y="160" width="270" height="660" rx="16" class="neutral"/>
    <rect x="1254" y="160" width="308" height="660" rx="16" class="neutral"/>
    <text x="173" y="195" text-anchor="middle" class="lane">DATA SOURCE</text>
    <text x="477" y="195" text-anchor="middle" class="lane">INGESTION / RAW</text>
    <text x="781" y="195" text-anchor="middle" class="lane">PROCESSING</text>
    <text x="1085" y="195" text-anchor="middle" class="lane">PROCESSED STORAGE</text>
    <text x="1408" y="195" text-anchor="middle" class="lane">ANALYSIS / BI</text>
  </g>

  <g>
    <rect x="66" y="238" width="214" height="112" rx="13" class="implemented"/>
    <text x="173" y="272" text-anchor="middle" class="box-title">Alpaca IEX</text>
    <text x="173" y="299" text-anchor="middle" class="box-copy">WebSocket · Kafka까지 검증</text>
    <text x="173" y="323" text-anchor="middle" class="box-copy">Historical REST · DB까지 검증</text>

    <rect x="370" y="238" width="214" height="112" rx="13" class="implemented"/>
    <text x="477" y="272" text-anchor="middle" class="box-title">Python Ingestion</text>
    <text x="477" y="299" text-anchor="middle" class="box-copy">live collector / replay</text>
    <text x="477" y="323" text-anchor="middle" class="box-copy">공통 event envelope</text>

    <rect x="370" y="426" width="214" height="124" rx="13" class="stored"/>
    <text x="477" y="462" text-anchor="middle" class="box-title">Kafka raw.market.v1</text>
    <text x="477" y="491" text-anchor="middle" class="box-copy">원본 거래 이벤트 임시 보관</text>
    <text x="477" y="518" text-anchor="middle" class="box-copy">symbol key · retention 24h</text>

    <rect x="674" y="426" width="214" height="124" rx="13" class="implemented"/>
    <text x="781" y="460" text-anchor="middle" class="box-title">Spark Streaming</text>
    <text x="781" y="488" text-anchor="middle" class="box-copy">schema 검증 · 중복 제거</text>
    <text x="781" y="515" text-anchor="middle" class="box-copy">event-time 1분 OHLCV</text>

    <rect x="978" y="426" width="214" height="124" rx="13" class="stored"/>
    <text x="1085" y="460" text-anchor="middle" class="box-title">PostgreSQL</text>
    <text x="1085" y="488" text-anchor="middle" class="box-copy">market_bars</text>
    <text x="1085" y="515" text-anchor="middle" class="box-copy">business-key upsert</text>

    <rect x="1282" y="426" width="252" height="124" rx="13" class="implemented"/>
    <text x="1408" y="460" text-anchor="middle" class="box-title">SQL / Evidence</text>
    <text x="1408" y="488" text-anchor="middle" class="box-copy">저장 건수·중복·시간 범위</text>
    <text x="1408" y="515" text-anchor="middle" class="box-copy">테스트 결과·발표 증거</text>
  </g>

  <path d="M280 294 H370" class="flow"/>
  <text x="325" y="282" text-anchor="middle" class="edge-copy">actual trade · 2개 경로</text>
  <path d="M477 350 V426" class="flow"/>
  <text x="489" y="392" class="edge-copy">live + historical</text>
  <path d="M584 488 H674" class="flow"/>
  <text x="629" y="476" text-anchor="middle" class="edge-copy">historical E2E</text>
  <path d="M888 488 H978" class="flow"/>
  <text x="933" y="476" text-anchor="middle" class="edge-copy">final 1m bar</text>
  <path d="M1192 488 H1282" class="flow"/>
  <text x="1237" y="476" text-anchor="middle" class="edge-copy">query</text>

  <g>
    <rect x="66" y="640" width="214" height="154" rx="13" class="planned"/>
    <text x="173" y="675" text-anchor="middle" class="box-title">공식 Macro Data</text>
    <text x="173" y="704" text-anchor="middle" class="box-copy">BLS · BEA · Fed 일정</text>
    <text x="173" y="730" text-anchor="middle" class="box-copy">FRED/ALFRED vintage</text>
    <text x="173" y="756" text-anchor="middle" class="box-copy">Historical SIP bars</text>

    <rect x="370" y="658" width="214" height="118" rx="13" class="planned"/>
    <text x="477" y="694" text-anchor="middle" class="box-title">Airflow Batch</text>
    <text x="477" y="722" text-anchor="middle" class="box-copy">schedule · retry · backfill</text>
    <text x="477" y="748" text-anchor="middle" class="box-copy">point-in-time 수집</text>

    <rect x="674" y="658" width="214" height="118" rx="13" class="planned"/>
    <text x="781" y="694" text-anchor="middle" class="box-title">Macro Processing</text>
    <text x="781" y="722" text-anchor="middle" class="box-copy">발표 전후 window 계산</text>
    <text x="781" y="748" text-anchor="middle" class="box-copy">평소·시장·섹터 비교</text>

    <rect x="978" y="658" width="214" height="118" rx="13" class="planned"/>
    <text x="1085" y="694" text-anchor="middle" class="box-title">PostgreSQL</text>
    <text x="1085" y="722" text-anchor="middle" class="box-copy">macro observations</text>
    <text x="1085" y="748" text-anchor="middle" class="box-copy">events / impacts</text>

    <rect x="1282" y="638" width="252" height="158" rx="13" class="planned"/>
    <text x="1408" y="675" text-anchor="middle" class="box-title">Analysis / BI</text>
    <text x="1408" y="704" text-anchor="middle" class="box-copy">경제지표 영향 report</text>
    <text x="1408" y="730" text-anchor="middle" class="box-copy">Streamlit / Dashboard</text>
    <text x="1408" y="756" text-anchor="middle" class="box-copy">후속 전략·백테스트</text>
  </g>

  <path d="M280 717 H370" class="planned-flow"/>
  <path d="M584 717 H674" class="planned-flow"/>
  <path d="M888 717 H978" class="planned-flow"/>
  <path d="M1192 717 H1282" class="planned-flow"/>

  <g transform="translate(66 862)">
    <text x="0" y="0" class="box-title">이번 과제 구현 범위</text>
    <text x="0" y="30" class="box-copy">실행 증거: WebSocket → Kafka / Historical REST → Kafka → Spark → PostgreSQL → SQL 검증</text>
    <text x="0" y="57" class="note">Kafka는 처리기 장애 시 재처리 가능한 raw event buffer이고, PostgreSQL은 조회 가능한 final 1분 데이터를 보관한다.</text>
  </g>
</svg>
