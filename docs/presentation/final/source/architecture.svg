    <!-- evidence-only link up to research PG -->
    <path d="M776 240 L776 158" stroke="#8A8A87" stroke-width="1.2" stroke-dasharray="4 4" fill="none" marker-end="url(#arwg)"/>
    <rect x="782" y="188" width="132" height="20" rx="3" fill="#F7F5F1"/>
    <text x="788" y="202" font-size="11" fill="#5B6570">비교·증거 전용 · 데이터 미유입</text>
  </g>

  <!-- ======== PRODUCT PLANE ======== -->
  <g>
    <rect x="0" y="352" width="1142" height="122" rx="6" fill="#FFFFFF" stroke="#D9D5CE"/>
    <rect x="0" y="352" width="6" height="122" rx="3" fill="#E56735"/>
    <g transform="translate(20,370)">
