    <path d="M876 413 L914 413" stroke="#E56735" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#arwo)"/>
    <text x="916" y="460" font-size="11" fill="#B84E23">사용자 수동 입력·검토·확인 · 자동 주문 없음</text>
  </g>

  <!-- ======== invariant ======== -->
  <text x="0" y="494" font-size="12" fill="#44505E" font-weight="600">Invariant — 202 × 10 연구 데이터는 Raw SIP Kafka/Spark 경로로 생성된 것이 아닙니다. Research market_bars와 validation 테이블은 물리적으로 분리됩니다.</text>
</svg>
