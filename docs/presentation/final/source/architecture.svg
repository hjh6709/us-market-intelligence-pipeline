    <text x="208" y="425" font-size="12" fill="#5B6570">PostgreSQL 결과만 읽음</text>

    <rect x="436" y="386" width="200" height="54" rx="4" fill="#E56735"/>
    <text x="448" y="407" font-size="13" font-weight="700" fill="#FFFFFF">FastAPI</text>
    <text x="448" y="425" font-size="12" fill="#FDE3D7">/api/v1 · 외부 API 미호출</text>

    <rect x="676" y="386" width="200" height="54" rx="4" fill="#FFF3EC" stroke="#E5B9A3"/>
    <text x="688" y="407" font-size="13" font-weight="600" fill="#171717">Browser UI</text>
    <text x="688" y="425" font-size="12" fill="#5B6570">Overview · Research · Pipelines</text>

    <rect x="916" y="386" width="200" height="54" rx="4" fill="#FFFFFF" stroke="#E56735" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="928" y="407" font-size="13" font-weight="700" fill="#B84E23">Manual Alpaca Paper</text>
    <text x="928" y="425" font-size="11.5" fill="#5B6570">guarded submit · reconcile · cancel</text>

    <g stroke="#44505E" stroke-width="1.4" fill="none" marker-end="url(#arw)">
