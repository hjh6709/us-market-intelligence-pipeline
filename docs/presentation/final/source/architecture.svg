<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1142 500" width="1142" height="500" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif">
  <!--
    Presentation-specific redraw of CURRENT_ARCHITECTURE.mmd (semantic source).
    Three planes, reduced node count. Colors: research navy, validation slate-violet,
    product orange. Storage = rounded rectangles with a top band. Dashed = evidence-only link.
  -->
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#44505E"/>
    </marker>
    <marker id="arwo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#E56735"/>
    </marker>
    <marker id="arwg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8A8A87"/>
    </marker>
  </defs>

  <!-- ======== column headers ======== -->
  <g font-size="12" font-weight="600" fill="#8A8A87" letter-spacing="1.5">
