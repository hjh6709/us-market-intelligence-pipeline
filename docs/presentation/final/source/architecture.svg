      <text x="208" y="111" font-weight="600">Alpaca SIP bars</text>
      <text x="208" y="127" font-size="12" fill="#5B6570">provider-aggregated 1m</text>

      <rect x="196" y="150" width="200" height="40" rx="4" fill="#F1F4F8" stroke="#B9C4D2"/>
      <text x="208" y="167" font-weight="600">FRED / ALFRED</text>
      <text x="208" y="183" font-size="12" fill="#5B6570">Point-in-Time 거시 맥락</text>
