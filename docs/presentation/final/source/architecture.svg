    <text x="554" y="283" font-size="11" fill="#DDD9EC">validate · dedup</text>
    <text x="554" y="297" font-size="11" fill="#DDD9EC">event-time agg</text>

    <rect x="676" y="240" width="200" height="74" rx="6" fill="#FFFFFF" stroke="#5E5A8A" stroke-width="1.5"/>
    <rect x="676" y="240" width="200" height="8" rx="4" fill="#5E5A8A"/>
    <text x="688" y="269" font-size="13" font-weight="700" fill="#5E5A8A">PostgreSQL · validation-only</text>
    <text x="688" y="287" font-size="12" fill="#5B6570">validation_runs (immutable)</text>
    <text x="688" y="303" font-size="12" fill="#5B6570">validation_reconstructed_bars</text>

    <rect x="916" y="250" width="200" height="54" rx="4" fill="#F3F1F8" stroke="#BDB8D2"/>
    <text x="928" y="271" font-size="13" font-weight="600" fill="#171717">Validation evidence</text>
    <text x="928" y="289" font-size="12" fill="#5B6570">parity · duplicate 0 · recovery</text>

