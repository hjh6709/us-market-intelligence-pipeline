    <text x="448" y="283" font-size="11" fill="#DDD9EC">bounded</text>
    <text x="448" y="297" font-size="11" fill="#DDD9EC">replay</text>

    <rect x="542" y="240" width="94" height="74" rx="4" fill="#5E5A8A"/>
