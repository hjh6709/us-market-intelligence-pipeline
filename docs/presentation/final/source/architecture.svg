      <text y="52" font-size="12" fill="#5B6570">Provider-aggregated bar</text>
      <text y="68" font-size="12" fill="#5B6570">기반 분석 데이터</text>
    </g>

    <!-- sources (3 stacked) -->
    <g font-size="13" fill="#171717">
