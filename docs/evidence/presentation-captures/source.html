<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pipeline execution evidence</title>
  <style>
    :root { --ink:#101828; --muted:#667085; --line:#d0d5dd; --panel:#f2f4f7; --blue:#1570ef; --green:#067647; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:1280px; height:720px; overflow:hidden; }
    body { background:#fff; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif; }
    main { position:relative; width:1280px; height:720px; padding:50px 58px 46px; background:#fff; overflow:hidden; }
    header { display:flex; align-items:flex-start; justify-content:space-between; border-bottom:2px solid var(--ink); padding-bottom:18px; }
    .eyebrow { color:var(--blue); font-size:17px; font-weight:750; letter-spacing:.04em; }
    h1 { margin:8px 0 0; font-size:39px; line-height:1.13; letter-spacing:-.035em; }
    .meta { margin-top:7px; color:var(--muted); font-size:15px; text-align:right; line-height:1.5; }
    .content { margin-top:28px; }
    .flow { margin-bottom:24px; font-size:25px; font-weight:720; letter-spacing:-.02em; }
    .flow span { color:var(--blue); }
    .metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin-top:18px; }
    .metric { min-height:160px; padding:25px 26px; border-top:5px solid var(--blue); background:var(--panel); }
    .metric.good { border-top-color:var(--green); }
    .value { font-size:49px; line-height:1; font-weight:780; letter-spacing:-.05em; }
    .label { margin-top:14px; font-size:19px; font-weight:700; }
    .desc { margin-top:8px; color:var(--muted); font-size:15px; line-height:1.45; }
    .two { display:grid; grid-template-columns:1.04fr .96fr; gap:28px; }
    .box { min-height:250px; padding:22px 24px; border:1px solid var(--line); }
    .box h2 { margin:0 0 14px; font-size:22px; }
    .box p, .box li { font-size:16px; line-height:1.55; }
    ul { margin:0; padding-left:21px; }
    pre { margin:0; padding:22px 24px; background:#101828; color:#d1fadf; font:16px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace; white-space:pre-wrap; }
    .result { display:flex; align-items:center; gap:12px; margin-top:22px; padding:17px 20px; background:#ecfdf3; color:var(--green); font-size:19px; font-weight:750; }
    .dot { width:13px; height:13px; border-radius:50%; background:#12b76a; }
    footer { position:absolute; right:58px; bottom:32px; left:58px; display:flex; justify-content:space-between; color:var(--muted); font-size:13px; }
    code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  </style>
</head>
<body>
  <main id="app"></main>
  <script>
    const views = {
      services: {
        title: "수집과 저장 서비스가 실행 가능한 상태입니다",
        flow: "Alpaca <span>→</span> Kafka raw.market.v1 <span>→</span> Spark <span>→</span> PostgreSQL",
        body: `<div class="two"><pre>$ docker ps --filter project-services

kafka-market-producer-kafka-1
STATUS  Up · healthy
PORT    9092

postgres-market-bars-postgres-1
STATUS  Up · healthy
PORT    55432</pre><div class="box"><h2>Raw storage 확인</h2><p>Kafka <code>raw.market.v1</code> 파티션 오프셋</p><ul><li>partition 0: 0</li><li>partition 1: 19</li><li>partition 2: 427</li></ul><div class="result"><span class="dot"></span>Kafka·PostgreSQL 모두 healthy</div></div></div>`,
        source: "docker ps · kafka-get-offsets (read-only)"
      },
      live: {
        title: "실시간 IEX 거래 10건을 Kafka까지 확인했습니다",
        flow: "Alpaca IEX WebSocket <span>→</span> Python Producer <span>→</span> Kafka",
        body: `<div class="metrics"><div class="metric good"><div class="value">10</div><div class="label">실제 거래 수신</div><div class="desc">SPY 4 · QQQ 2 · NVDA 4</div></div><div class="metric good"><div class="value">10</div><div class="label">Kafka 발행·재소비</div><div class="desc">canonical envelope 10/10 유효</div></div><div class="metric"><div class="value">9/9</div><div class="label">원본 필드 유지</div><div class="desc">T·S·i·x·p·s·c·t·z</div></div></div><div class="result"><span class="dot"></span>WebSocket → Kafka 완료 · WebSocket → PostgreSQL은 다음 정규장 검증</div>`,
        source: "docs/test-results/2026-08-19-kafka-producer-smoke.md"
      },
      actual: {
        title: "실제 거래 427건 발행 후, 174건이 확정 봉 3건에 반영됐습니다",
        flow: "Alpaca Historical IEX <span>→</span> Kafka <span>→</span> Spark <span>→</span> PostgreSQL",
        body: `<div class="metrics"><div class="metric good"><div class="value">427</div><div class="label">조회 = 발행</div><div class="desc">실제 SMH trade · API 1 page</div></div><div class="metric good"><div class="value">174</div><div class="label">확정 봉 반영 거래</div><div class="desc">3개 final 1분봉 · 19:50Z ~ 19:52Z</div></div><div class="metric good"><div class="value">0</div><div class="label">중복 business key</div><div class="desc">symbol + bar_start + source + feed</div></div></div><div class="result"><span class="dot"></span>나머지 구간은 실행 종료 시 watermark 미통과로 final row에 저장되지 않음</div>`,
        source: "docs/evidence/actual-ingestion/result.json"
      },
      storage: {
        title: "PostgreSQL에 실제 SMH 최종 봉 3건을 저장했습니다",
        flow: "Spark final bar <span>→</span> transaction upsert <span>→</span> market_bars",
        body: `<div class="two"><pre>$ SELECT symbol, count(*),
         sum(trade_count), sum(volume)
  FROM market_bars
 WHERE symbol = 'SMH' AND is_final
 GROUP BY symbol;

 symbol | bars | trades | volume
--------+------+--------+-------
 SMH    | 3    | 174    | 6914</pre><div class="box"><h2>저장 품질 기준</h2><ul><li>최종 봉만 PostgreSQL에 저장</li><li>UTC 시각 범위 19:50Z~19:52Z</li><li><code>source=alpaca</code>, <code>feed=iex</code></li><li>business key 수와 row 수 일치</li></ul><div class="result"><span class="dot"></span>중복 key 0건</div></div></div>`,
        source: "PostgreSQL read-only query · 2026-08-20"
      },
      tests: {
        title: "단위 45개와 Kafka·Spark 통합 2개를 다시 통과했습니다",
        flow: "Unit tests <span>+</span> Kafka integration <span>+</span> Spark checkpoint integration",
        body: `<div class="metrics"><div class="metric good"><div class="value">45</div><div class="label">단위 테스트 통과</div><div class="desc">문서 계약·Producer·Spark·DB sink 포함</div></div><div class="metric good"><div class="value">2/2</div><div class="label">통합 테스트 통과</div><div class="desc">Kafka 발행/소비 · Spark checkpoint 재시작</div></div><div class="metric good"><div class="value">1</div><div class="label">late event 제외</div><div class="desc">watermark 이후 event가 final 봉을 변경하지 않음</div></div></div><div class="result"><span class="dot"></span>전체 단위 테스트 OK · 선택 통합 6개는 별도 실행 조건으로 분리</div>`,
        source: "unittest 재실행 · 2026-08-20 15:17 KST"
      },
      recovery: {
        title: "DB 중단 실패와 동일 batch 복구 재처리를 확인했습니다",
        flow: "PostgreSQL stop <span>→</span> OperationalError <span>→</span> restart <span>→</span> same batch retry",
        body: `<div class="metrics"><div class="metric"><div class="value">9001</div><div class="label">Spark batch ID</div><div class="desc">중단 전과 복구 후 동일 batch 재시도</div></div><div class="metric good"><div class="value">ERROR</div><div class="label">중단 중 명시적 실패</div><div class="desc">OperationalError · 성공으로 오인하지 않음</div></div><div class="metric good"><div class="value">1</div><div class="label">복구 후 최종 row</div><div class="desc">중복 없이 close 102 · volume 11</div></div></div><div class="result"><span class="dot"></span>DB 장애 중 rollback · 재시작 후 같은 batch 재처리 성공</div>`,
        source: "docs/evidence/postgres-market-bars/result.json"
      }
    };
    const key = new URLSearchParams(location.search).get("view") || "actual";
    const view = views[key] || views.actual;
    document.getElementById("app").innerHTML = `<header><div><div class="eyebrow">EXECUTION EVIDENCE · SANITIZED</div><h1>${view.title}</h1></div><div class="meta">U.S. Macro Impact &amp; Market Data Pipeline<br>검증일 2026-08-20</div></header><div class="content"><div class="flow">${view.flow}</div>${view.body}</div><footer><span>API key · connection URL · raw payload 비노출</span><span>${view.source}</span></footer>`;
  </script>
</body>
</html>
