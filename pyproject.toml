[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "for-my-stock"
version = "0.1.0"
description = "U.S. macro impact and market data pipeline"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.15,<3",
    "psycopg[binary]>=3.2,<4",
    "pyspark==4.2.0",
    "websockets>=15,<16",
]

[project.optional-dependencies]
airflow = [
    "apache-airflow==3.3.0",
]

[tool.setuptools]
packages = ["src"]
